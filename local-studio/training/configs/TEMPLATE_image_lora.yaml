# REFERENCE VALUES for an ai-toolkit image LoRA (e.g. a consistent person).
# Do not run this file as-is. Copy the example config for your base model from
# <ai-toolkit>/config/examples/ (it matches your installed version), then apply
# the values marked "OURS" below. Field names can differ between ai-toolkit versions.
job: extension
config:
  name: "camden_v1"                      # OURS: versioned name; matches training/active.json "name"
  process:
    - type: "sd_trainer"
      training_folder: "output"          # ai-toolkit writes output/<name>/ -> set active.json "output_dir" to it
      device: "cuda:0"
      trigger_word: "cmdn person"        # OURS
      network:
        type: "lora"
        linear: 16                       # OURS: rank 16 to start; 8 if overfitting/artifacts
        linear_alpha: 16
      save:
        dtype: "float16"
        save_every: 250                  # OURS: lets us fall back to an earlier checkpoint if overfit
        max_step_saves_to_keep: 6
      datasets:
        - folder_path: "D:/AI/datasets/camden_v1"   # OURS: dataset outside the repo
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          resolution: [768, 1024]
      train:
        batch_size: 1
        steps: 2000                      # OURS: 1500-2500 for a person
        gradient_accumulation_steps: 1
        gradient_checkpointing: true
        optimizer: "adamw8bit"
        lr: 1.0e-4                       # OURS: drop to 5e-5 if quality degrades
        dtype: "bf16"
      model:
        # OURS: base model — keep the example config's model block for your chosen base
        # (Qwen-Image for commercial-safe work; FLUX.2 [dev] is non-commercial).
        name_or_path: "<from example config>"
        quantize: true                   # fits comfortably in 32 GB
      sample:
        sample_every: 250
        width: 1024
        height: 1024
        seed: 42
        prompts:                         # OURS: quick in-training previews
          - "cmdn person, professional headshot, navy suit, gray studio backdrop, 85mm"
          - "cmdn person, laughing on a rooftop terrace at golden hour, 50mm"
          - "cmdn person, side profile by a rainy window, moody light"
meta:
  name: "[name]"
  version: "1.0"
